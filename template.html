<!DOCTYPE html>
<html>
<head><title>Add Item</title></head>
<body>
    <h3>Create New Inventory Log Entry</h3>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label>Item Name:</label><br>
        <input type="text" name="item_name" required><br><br>
        
        <label>Quantity:</label><br>
        <input type="number" name="quantity" required><br><br>
        
        <label>Status:</label><br>
        <input type="text" name="status" value="Available"><br><br>
        
        <label>Insecure File Attachment Upload (RCE Target):</label><br>
        <input type="file" name="attachment"><br><br>
        
        <button type="submit">Save Record</button>
    </form>
    <br><a href="{% url 'inventory_list' %}">Back to List</a>
</body>
</html>
